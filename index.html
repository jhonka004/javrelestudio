<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Javrel Studio — Ingeniería de Software, Desarrollo Web, Aplicaciones a Medida, ERP/CRM/POS y Automatización con IA." />
    <meta property="og:title" content="Javrel Studio — Software, IA & Experiencias Digitales" />
    <meta property="og:description" content="Construimos plataformas digitales de alto impacto: e-commerce, ERP, CRM, POS y soluciones con IA." />
    <title>Javrel Studio — Software, IA & Experiencias Digitales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- SVG Displacement Filter (Liquid Morph) -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <filter id="liquid-morph">
          <feTurbulence id="turbulence" type="turbulence" baseFrequency="0.015 0.015"
            numOctaves="3" seed="2" stitchTiles="stitch" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise"
            scale="0" xChannelSelector="R" yChannelSelector="G"
            result="displaced" />
        </filter>
        <filter id="glass-blur">
          <feGaussianBlur stdDeviation="8" />
        </filter>
      </defs>
    </svg>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
